name: Android Release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Expo package compatibility
        run: npx expo install --check
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Enable Android release optimizations
        run: |
          printf '\nandroid.enableProguardInReleaseBuilds=true\nandroid.enableShrinkResourcesInReleaseBuilds=true\nandroid.enablePngCrunchInReleaseBuilds=true\n' >> android/gradle.properties
          sed -i '/release {/a\            signingConfig signingConfigs.debug' android/app/build.gradle
      - name: Build optimized release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: forsati-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
